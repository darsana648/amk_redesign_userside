<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segment · AMK</title>
  <meta name="description" content="AMK business segment — categories and products." />
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="preconnect" href="https://api.amktrading.com" />
  <link rel="dns-prefetch" href="https://amk-trading-media.s3.ap-south-1.amazonaws.com" />

  <!-- Tailwind CSS (Play CDN) + shared theme tokens -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- Site scripts (order matters) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/enquiry.js"></script>
</head>
<body class="flex min-h-screen flex-col">
  <script>AMK.renderTop()</script>

  <main id="main" class="flex-1">
    <div id="segment-root"></div>
  </main>

  <script>AMK.renderBottom()</script>
  <script>
    (function () {
      const AMK = window.AMK;
      const E = AMK.esc;
      const I = AMK.i;
      const root = document.getElementById("segment-root");
      const seg = AMK.SEGMENTS.find((s) => s.slug === AMK.qs("slug"));
      if (!seg) { root.innerHTML = AMK.ui.notFound("segment"); return; }
      document.title = `${seg.short} · AMK`;

      root.innerHTML = `
        ${AMK.ui.breadcrumb([{ label: "Segments", href: "/segments" }, { label: seg.name }])}
        <section class="container-site">
          <div class="relative overflow-hidden rounded-2xl bg-navy">
            <img src="${AMK.img(seg.image, 1600)}" alt="${E(seg.name)}" class="absolute inset-0 h-full w-full object-cover" fetchpriority="high" />
            <div class="absolute inset-0 bg-gradient-to-r from-[#061631]/95 via-[#0b2b5c]/70 to-transparent"></div>
            <div class="relative px-6 py-12 text-white md:px-12 md:py-16">
              <span class="chip bg-accent text-white">${I(seg.icon, "h-3.5 w-3.5")} AMK Segment</span>
              <h1 class="mt-4 max-w-2xl text-3xl font-extrabold tracking-tight text-white md:text-5xl">${E(seg.short)}</h1>
              <p class="mt-3 max-w-xl text-[15px] text-white/80 md:text-base">${E(seg.description)}</p>
              <div class="mt-6 flex flex-wrap gap-3">
                <a href="contact.html#rfq" class="btn btn-accent btn-lg">Request Quote</a>
                <a href="#products" class="btn btn-ghost-light btn-lg">Browse Products</a>
              </div>
            </div>
          </div>
        </section>

        <section class="container-site pt-5">
          <div class="panel p-5">
            ${AMK.ui.sectionHead({ title: `Categories in ${seg.name}` })}
            <div id="seg-cats" class="grid grid-cols-3 gap-4 md:grid-cols-6">
              ${Array.from({ length: 6 }, () => `<div><div class="skeleton aspect-square w-full !rounded-xl"></div><div class="skeleton mx-auto mt-2 h-3 w-3/4"></div></div>`).join("")}
            </div>
          </div>
        </section>

        <section id="products" class="container-site scroll-mt-16 pt-5">
          <div class="panel p-5">
            ${AMK.ui.sectionHead({ title: "Products", right: `<span id="seg-count" class="text-[13px] text-ink-soft"></span>` })}
            <div id="seg-products">${AMK.ui.skeletonGrid(10)}</div>
          </div>
        </section>

        <section class="container-site pt-5">
          <div class="bg-hero relative flex flex-col gap-5 overflow-hidden rounded-2xl p-8 text-white md:flex-row md:items-center md:justify-between md:p-10">
            <div class="bg-dots pointer-events-none absolute inset-0 opacity-40"></div>
            <div class="relative">
              <h3 class="text-2xl font-bold text-white">Need a project quote for ${E(seg.name)}?</h3>
              <p class="mt-1 text-[15px] text-white/75">Our application engineers respond within 24 hours.</p>
            </div>
            <a href="contact.html#rfq" class="btn btn-accent btn-lg relative">Talk to AMK ${I("arrow-right", "h-4 w-4")}</a>
          </div>
        </section>`;

      AMK.get(`/categories/${seg.root}/children/`).then((d) => {
        const cats = d?.children || [];
        document.getElementById("seg-cats").innerHTML = cats.map((c) => `
          <a href="${AMK.url(`/category/${c.slug}`)}" class="group flex flex-col items-center text-center">
            <span class="block aspect-square w-full overflow-hidden rounded-xl border border-line bg-canvas transition group-hover:border-accent">
              <img src="${E(AMK.img(c.image, 240))}" alt="${E(c.name)}" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
            </span>
            <span class="mt-2 line-clamp-2 text-[13.5px] font-semibold leading-tight text-ink group-hover:text-accent">${E(c.name)}</span>
          </a>`).join("") || `<p class="col-span-full text-sm text-ink-soft">Categories are being set up.</p>`;
      });

      AMK.get(`/products/?segment=${seg.id}`).then((list) => {
        const products = AMK.mapProducts(list || []);
        const box = document.getElementById("seg-products");
        document.getElementById("seg-count").textContent = `${products.length} products`;
        if (!products.length) {
          box.innerHTML = AMK.ui.emptyState("Catalog being populated", "Request a quote and we'll confirm availability.");
          return;
        }
        let shown = 0;
        const more = () => {
          shown = Math.min(products.length, shown + 20);
          box.innerHTML = AMK.ui.productGrid(products.slice(0, shown)) + (shown < products.length
            ? `<div class="mt-6 text-center"><button type="button" id="seg-more" class="btn btn-outline-accent">Show more · ${products.length - shown} remaining</button></div>`
            : "");
          document.getElementById("seg-more")?.addEventListener("click", more);
        };
        more();
      });
    })();
  </script>
</body>
</html>

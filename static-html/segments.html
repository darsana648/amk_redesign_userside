<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Segments · AMK</title>
  <meta name="description" content="AMK is structured around six business segments — from heavy industrial automation to retail electrical and smart-factory IT." />
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="preconnect" href="https://api.amktrading.com" />
  <link rel="dns-prefetch" href="https://amk-trading-media.s3.ap-south-1.amazonaws.com" />

  <!-- Tailwind CSS (Play CDN) + shared theme tokens -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- Site scripts (order matters) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/enquiry.js"></script>
</head>
<body class="flex min-h-screen flex-col">
  <script>AMK.renderTop()</script>

  <main id="main" class="flex-1">
    <script>document.currentScript.insertAdjacentHTML("afterend",
      AMK.ui.breadcrumb([{ label: "Segments" }]) +
      AMK.ui.pageHeader({
        eyebrow: "What we trade",
        title: "Our Six Business Segments",
        sub: "AMK is structured around six segments — covering everything from heavy industrial automation to retail electrical and smart-factory IT.",
        image: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1400&q=60",
      }))</script>

    <section class="container-site pt-5">
      <div id="segments-grid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>
  </main>

  <script>AMK.renderBottom()</script>
  <script>
    document.getElementById("segments-grid").innerHTML = AMK.SEGMENTS.map((s) => `
      <a href="segment.html?slug=${s.slug}" class="card card-hover group flex flex-col overflow-hidden">
        <div class="relative aspect-[16/9] overflow-hidden">
          <img src="${AMK.img(s.image, 700)}" alt="${AMK.esc(s.name)}" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#060d1f]/80 to-transparent"></div>
          <span class="absolute bottom-3 left-4 inline-flex items-center gap-2 text-[17px] font-bold text-white">
            <span class="grid h-9 w-9 place-items-center rounded-full bg-accent text-white">${AMK.i(s.icon, "h-4 w-4")}</span>${AMK.esc(s.name)}
          </span>
        </div>
        <div class="flex flex-1 flex-col p-5">
          <p class="text-[12px] font-semibold uppercase tracking-[0.06em] text-accent">${AMK.esc(s.tagline)}</p>
          <h2 class="mt-1 text-[17px] font-bold">${AMK.esc(s.short)}</h2>
          <p class="mt-2 text-[14px] leading-relaxed text-ink-muted">${AMK.esc(s.description)}</p>
          <span class="link-more mt-auto pt-4 !text-accent">Explore segment ${AMK.i("chevron-right", "h-4 w-4")}</span>
        </div>
      </a>`).join("");
  </script>
</body>
</html>
